# Desktop replay (analysis/replay/run_replay.py): the laptop's Performance profile with XeSS instead of DLSS, because
# the replay GPUs are AMD (no NGX). Option names checked against analysis/runtime/remix-probe/RtxOptions-1.6.md.
# dlssPreset Custom (2): with the default On, the runtime sets upscalerType = DLSS in its Derived layer, above rtx.conf,
# and without NGX that falls back to TAAU at the non-NVIDIA resolutionScale 0.5 (rtx_options.cpp updateUpscalerFromDlssPreset,
# rtx_context.cpp:566). Every replay before 2026-11-12 p4 ran that TAAU, whatever upscalerType said.
rtx.dlssPreset = 2
rtx.upscalerType = 4
rtx.xess.preset = 1
rtx.enableRayReconstruction = False
rtx.dlfg.enable = False
rtx.automation.disableBlockingDialogBoxes = True
rtx.useNewGuiInputMethod = False
# Half of NieR's scene draws are under 1,000 triangles, so by default they land in the merged dynamic BLAS the runtime
# rebuilds every frame. 0 promotes every mesh to its own BLAS: 30632051 25.1 -> 29.2 fps, 21396979 49.2 -> 52.4,
# 41686139 42.9 -> 43.4, at an unchanged picture (edge energy equal, mean abs difference 1.1-1.3 grey levels = denoiser
# noise between runs). 300 is worse than 0; 3000 much worse (21.7 fps on 30632051).
rtx.minPrimsInDynamicBLAS = 0

# Exposure and tone mapping for the UNORM albedo picture (PLAN_2026-11-13, item L1; chosen 2026-11-13 from the sheets
# /tmp/l1-30632051.jpg and /tmp/l1-41686139.jpg, user picked "3 or 4", 4 taken on the numbers: saturation 0.128 -> 0.149
# on the camp and 0.126 -> 0.129 on 41686139, clipping and crushing at 0.0-0.1% on both). Global tonemapping replaces the
# local one, which was tuned by eye against the darker sRGB-tagged picture and leaves the ground near white under UNORM.
# Key names read from remix-1.6.1: rtx.tonemappingMode 0 = Global (rtx_options.h:1181), colour grading and saturation
# rtx_tone_mapping.h:103-120. To go back to the old look, delete these four lines (local tonemap, exposure 0.75).
# variant 3 in the sheet is the same block with saturation 1.15.
rtx.tonemappingMode = 0
rtx.tonemap.dynamicRange = 15
rtx.tonemap.colorGradingEnabled = True
rtx.tonemap.saturation = 1.3
