# Laptop run B (2026-10-30): run A plus DLSS at its highest-performance scaling.
rtx.dlfg.enable = False
rtx.enableRayReconstruction = True
# Custom graphics preset, so the automatic Medium preset chosen for RTX Spark does not overwrite the DLSS mode.
# Values from the runtime source enums (GraphicsPreset: Ultra, High, Medium, Low, Custom=4, Auto=5;
# DLSSProfile: UltraPerf=0, MaxPerf=1, Balanced, MaxQuality, Auto=4); both defaults in RtxOptions-1.6.md agree.
# If the run's readback (path-tracing wait) does not drop, these numbers are wrong and must not be reused.
rtx.graphicsPreset = 4
rtx.upscalerType = 1
rtx.qualityDLSS = 1
