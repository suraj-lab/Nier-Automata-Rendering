# Laptop run B (2026-10-30): run A plus DLSS at a fixed performance scaling instead of Auto.
# Enums from dxvk-remix src/dxvk/rtx_render (rtx_options.h, rtx_dlss.h, rtx_options.cpp, main branch):
#   UpscalerType   None=0, DLSS=1, NIS=2, TAAU=3, XeSS=4
#   DlssPreset     Off=0, On=1, Custom=2   (On forces upscalerType=DLSS, qualityDLSS=Auto, reflex=LowLatency)
#   DLSSProfile    UltraPerf=0, MaxPerf=1, Balanced=2, MaxQuality=3, Auto=4, FullResolution=5
# The graphics preset (Auto -> Medium on RTX Spark) resets qualityDLSS to Auto unless dlssPreset is Custom.
rtx.dlfg.enable = False
rtx.enableRayReconstruction = True
rtx.dlssPreset = 2
rtx.upscalerType = 1
rtx.qualityDLSS = 1
# The "Welcome to RTX Remix" first-use dialog opened every run inside Remix's own (hidden) window, waiting for input
# nobody can give; the user saw it only in a recording (2026-10-31). Option verified in remix-1.6.1 rtx_options.h:1305
# and dxvk_imgui_first_use_guide.cpp shouldShow().
rtx.automation.disableBlockingDialogBoxes = True
# Keyboard dead in game (2026-11-04 frametime2-demo, twice): with this option on (default True), Remix creates its
# GameOverlay input sink and registers the keyboard for the whole process with RIDEV_INPUTSINK | RIDEV_NOLEGACY
# (remix-1.6.1 rtx_overlay_window.cpp:491-502, dxvk_imgui.cpp:655). NOLEGACY stops WM_KEYDOWN for the game window and
# NieR reads keys through GetKeyState. Startup-only option (rtx_options.h:537). Cost: Remix's own dev menu loses input.
rtx.useNewGuiInputMethod = False
