# Laptop run A (2026-10-30): one change against the runtime's automatic profile.
# DLSS frame generation presents into Remix's hidden window, which the copy-based host never shows: pure GPU cost.
rtx.dlfg.enable = False
# Already the default; set explicitly so the runtime's "Effective RtxOption values" log proves the file was read.
rtx.enableRayReconstruction = True
# Keyboard dead in game (2026-11-04 frametime2-demo, twice): with this option on (default True), Remix creates its
# GameOverlay input sink and registers the keyboard for the whole process with RIDEV_INPUTSINK | RIDEV_NOLEGACY
# (remix-1.6.1 rtx_overlay_window.cpp:491-502, dxvk_imgui.cpp:655). NOLEGACY stops WM_KEYDOWN for the game window and
# NieR reads keys through GetKeyState. Startup-only option (rtx_options.h:537). Cost: Remix's own dev menu loses input.
rtx.useNewGuiInputMethod = False

# Offline replay, 2026-11-12 (analysis/replay/README.md): half of NieR's scene draws are under 1,000 triangles, so by
# default they land in the merged dynamic BLAS the runtime rebuilds every frame. Promoting every mesh to its own BLAS
# measured 30632051 25.1 -> 29.3 fps, 21396979 49.2 -> 52.8, 41686139 42.9 -> 43.9, 23275488 46.5 -> 50.4, laptop
# captures 24.3 -> 28.2 and 21.7 -> 26.4, with the picture unchanged (edge energy equal, 1.1-1.3 grey levels of
# denoiser noise). Tested on the RX 6800 XT; the value is an option, not a preset, so any GPU can use it.
rtx.minPrimsInDynamicBLAS = 0

# Exposure and tone mapping for the UNORM albedo picture (PLAN_2026-11-13, item L1; chosen 2026-11-13 from the sheets
# /tmp/l1-30632051.jpg and /tmp/l1-41686139.jpg, user picked "3 or 4", 4 taken on the numbers: saturation 0.128 -> 0.149
# on the camp and 0.126 -> 0.129 on 41686139, clipping and crushing at 0.0-0.1% on both). Global tonemapping replaces the
# local one, which was tuned by eye against the darker sRGB-tagged picture and leaves the ground near white under UNORM.
# Key names read from remix-1.6.1: rtx.tonemappingMode 0 = Global (rtx_options.h:1181), colour grading and saturation
# rtx_tone_mapping.h:103-120. To go back to the old look, delete these four lines (local tonemap, exposure 0.75).
# variant 3 in the sheet is the same block with saturation 1.15.
rtx.tonemappingMode = 0
rtx.tonemap.dynamicRange = 15
rtx.tonemap.colorGradingEnabled = True
rtx.tonemap.saturation = 1.3
