# In-game Remix conf (PLAN_2026-11-13, L1 final pass, 2026-11-14). Read by Remix through DXVK_RTX_CONFIG_FILE, which the
# proxy (remix_live.cpp) points at this file: Remix's own lookup is relative to the working directory and never found
# it in the game, so every in-game run before 2026-11-14 ran Remix's defaults.
# Base: deploy/rtx/desktop-replay.conf (XeSS through dlssPreset 2, minPrimsInDynamicBLAS 0); grade fitted in the game to
# the game's own frame at the same spot (runs game-truth / game-full): median 0.333 vs 0.306, p95 0.564 vs 0.554,
# saturation 0.191 vs 0.184, R:B 1.23 vs 1.21. 55.9 fps at 640x350.
#
# The previous contents are kept below as comments: read for the first time on 2026-11-14 they killed the game 20 s in
# (run game-l1b). Which line is not bisected yet. Backup: backups/rtx-conf-20261114/rtx.conf
# old: # Live in-game Remix (remix_live.cpp). Values verified against dxvk-remix bbd74a12 rtx_options.h:
# old: #   DlssPreset { Off=0, On, Custom=2 }: Off REWRITES upscalerType to None and On to DLSS (absent on AMD), so XeSS
# old: #   needs Custom. XeSSPreset { UltraPerf=0, Performance=1, Balanced=2, Quality=3, ... }.
# old: # rtx.enhanced.conf has dlssPreset=0, i.e. it never ran XeSS; do not copy it for live use.
# old: # Path tracing at 3440x1440 saturated the 9070 XT (GPU 96-100%, 2.7 fps) with the whole frame traced. 0.75 was the
# old: # default; 0.6 traces 64% of the pixels. One knob at a time, measured from NIER_SCALE.log.
# old: rtx.resolutionScale = 0.3
# old: rtx.upscalerType = 4
# old: rtx.dlssPreset = 2
# old: rtx.xess.preset = 1
# old: rtx.enableRayReconstruction = False
# old: rtx.dlfg.enable = False
# old: rtx.dlssNeuralRendering.enable = False
# old: rtx.useDenoiser = True
# old: rtx.useDenoiserReferenceMode = False
# old: rtx.enableCullingInSecondaryRays = True
# old: rtx.volumetrics.enable = True
# old: rtx.volumetrics.enableAtmosphere = True
# old: rtx.volumetrics.atmosphereHeightMeters = 30

rtx.dlssPreset = 2
rtx.upscalerType = 4
rtx.xess.preset = 1
rtx.enableRayReconstruction = False
rtx.dlfg.enable = False
rtx.automation.disableBlockingDialogBoxes = True
rtx.useNewGuiInputMethod = False
rtx.minPrimsInDynamicBLAS = 0
rtx.tonemappingMode = 0
rtx.tonemap.dynamicRange = 15
rtx.tonemap.colorGradingEnabled = True
rtx.tonemap.saturation = 1.6
rtx.tonemap.contrast = 0.90
rtx.tonemap.colorBalance = 1.0, 0.89, 0.70
rtx.tonemap.exposureBias = -0.85
