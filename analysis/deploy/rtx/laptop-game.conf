# Laptop (spaghetti, RTX Spark N1X, ARM64EC) for play, 2026-11-14: laptop-b-dlss-perf.conf (DLSS via dlssPreset 2, Ray
# Reconstruction) with the L1 grade fitted in the game on the desktop to the game's own frame (deploy/rtx/game.conf).
# Exposure was fitted under XeSS without Ray Reconstruction: check one truth pair on the laptop before trusting it.
rtx.dlfg.enable = False
rtx.enableRayReconstruction = True
rtx.dlssPreset = 2
rtx.upscalerType = 1
# DLSS Ultra Performance (2026-11-14: laptop play was 17 fps, GPU-bound, at 1 = Performance; +40% measured at 2880x1800).
# Rollback: rtx.qualityDLSS = 1
rtx.qualityDLSS = 0
rtx.automation.disableBlockingDialogBoxes = True
rtx.useNewGuiInputMethod = False
rtx.minPrimsInDynamicBLAS = 0
rtx.tonemappingMode = 0
rtx.tonemap.dynamicRange = 15
rtx.tonemap.colorGradingEnabled = True
rtx.tonemap.saturation = 1.6
rtx.tonemap.contrast = 0.90
rtx.tonemap.colorBalance = 1.0, 0.89, 0.70
rtx.tonemap.exposureBias = -0.85
