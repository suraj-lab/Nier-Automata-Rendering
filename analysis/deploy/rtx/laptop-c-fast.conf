# Laptop run C (2026-10-31): run B with the cheapest path-traced frame, for camera smoothness.
# The game shows a new Remix image only every ~65 ms at 2880x1800 with MaxPerf, and the GPU time also stalls the
# game's own D3D11 calls (~100 ms frames outside our hooks). Enums verified in the remix-1.6.1 tag:
#   GraphicsPreset (rtx_graphics_preset.h) Ultra=0, High=1, Medium=2, Low=3, Custom=4, Auto=5
#   DLSSProfile    UltraPerf=0, MaxPerf=1, Balanced=2, MaxQuality=3, Auto=4, FullResolution=5
#   DlssPreset     Off=0, On=1, Custom=2 (Custom keeps qualityDLSS from being reset by the graphics preset)
rtx.dlfg.enable = False
rtx.enableRayReconstruction = True
rtx.dlssPreset = 2
rtx.upscalerType = 1
rtx.qualityDLSS = 0
rtx.graphicsPreset = 3
# Keyboard dead in game (2026-11-04 frametime2-demo, twice): with this option on (default True), Remix creates its
# GameOverlay input sink and registers the keyboard for the whole process with RIDEV_INPUTSINK | RIDEV_NOLEGACY
# (remix-1.6.1 rtx_overlay_window.cpp:491-502, dxvk_imgui.cpp:655). NOLEGACY stops WM_KEYDOWN for the game window and
# NieR reads keys through GetKeyState. Startup-only option (rtx_options.h:537). Cost: Remix's own dev menu loses input.
rtx.useNewGuiInputMethod = False
