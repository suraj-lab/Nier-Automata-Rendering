# Enhancement-layer config: modern features that work on an AMD/Vulkan host (no NGX).
# UpscalerType: 0=None 1=DLSS 2=NIS 3=TAAU 4=XeSS (rtx_options.h, see rtx.no-ngx.conf).
rtx.upscalerType = 4
rtx.xess.preset = 2
rtx.dlssPreset = 0
rtx.enableRayReconstruction = False
rtx.dlfg.enable = False
rtx.dlssNeuralRendering.enable = False
# NRD is not NGX. Reference mode must stay OFF or the denoiser guides are never allocated.
rtx.useDenoiser = True
rtx.useDenoiserReferenceMode = False
# Thin-geometry overdraw streaks: cull the secondary rays instead of smearing them.
rtx.enableCullingInSecondaryRays = True
# A finite atmosphere is what lets sky and distant lights feed the volumetrics.
rtx.volumetrics.enable = True
rtx.volumetrics.enableAtmosphere = True
rtx.volumetrics.atmosphereHeightMeters = 30
