# Test-folder-only Remix config: disable every feature that creates an NGX context, so NGX (and the
# NVIDIA telemetry its shutdown waits on) is never initialized. Values from rtx_options.h / rtx_dlfg.h /
# rtx_dlss_neural_rendering.h at dxvk-remix bbd74a12. UpscalerType: 0=None 1=DLSS 2=NIS 3=TAAU 4=XeSS.
rtx.upscalerType = 0
rtx.dlssPreset = 0
rtx.enableRayReconstruction = False
rtx.dlfg.enable = False
rtx.dlssNeuralRendering.enable = False
