# Live in-game Remix (remix_live.cpp). Values verified against dxvk-remix bbd74a12 rtx_options.h:
#   DlssPreset { Off=0, On, Custom=2 }: Off REWRITES upscalerType to None and On to DLSS (absent on AMD), so XeSS
#   needs Custom. XeSSPreset { UltraPerf=0, Performance=1, Balanced=2, Quality=3, ... }.
# rtx.enhanced.conf has dlssPreset=0, i.e. it never ran XeSS; do not copy it for live use.
rtx.upscalerType = 4
rtx.dlssPreset = 2
rtx.xess.preset = 1
rtx.enableRayReconstruction = False
rtx.dlfg.enable = False
rtx.dlssNeuralRendering.enable = False
rtx.useDenoiser = True
rtx.useDenoiserReferenceMode = False
rtx.enableCullingInSecondaryRays = True
rtx.volumetrics.enable = True
rtx.volumetrics.enableAtmosphere = True
rtx.volumetrics.atmosphereHeightMeters = 30
