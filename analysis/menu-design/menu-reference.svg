<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title description">
  <title id="title">NIER RENDER — compact overlay design reference</title>
  <desc id="description">Two states of a proposed 552 by 516 pixel overlay. Left: Custom75 active with no edits. Right: Native selected but not yet saved; active Custom75 and actual resolutions stay unchanged. Lower notes describe save and failure feedback. This is an original static concept, not an installed menu or game screenshot.</desc>
  <defs>
    <style>
      text { font-family: 'Noto Sans', sans-serif; fill: #292b27; }
      .mono { font-family: 'Noto Sans Mono', monospace; }
      .muted { fill: #68665b; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
      .body { font-size: 15px; }
      .small { font-size: 12px; }
      .outer { fill: #d7d8ca; }
      .disabled { fill: #858275; }
      .line { stroke: #c5bead; stroke-width: 1; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fada0" stroke-opacity="0.035"/>
    </pattern>
    <g id="panel-shell">
      <rect x="4" y="6" width="552" height="516" rx="3" fill="#000" opacity="0.22"/>
      <rect width="552" height="516" rx="3" fill="#eae5d7" stroke="#b9b29e"/>
      <rect width="4" height="80" fill="#4d5743"/>
      <text x="24" y="36" font-size="22" font-weight="600" letter-spacing="2">NIER RENDER</text>
      <text x="24" y="59" class="small muted mono">FSR 4.1.1 · D3D11 · PROTON</text>
      <path d="M508 23l12 12m0-12l-12 12" stroke="#55574e" stroke-width="1.5"/>
      <line x1="24" x2="528" y1="80" y2="80" class="line"/>
      <text x="24" y="111" class="label muted">ACTIVE THIS SESSION</text>
      <text x="24" y="148" font-size="27" font-weight="500">Custom75</text>
      <rect x="178" y="128" width="88" height="23" rx="2" fill="#ded8c9"/>
      <text x="222" y="144" class="small mono" text-anchor="middle">75% / axis</text>
      <text x="24" y="184" class="mono" font-size="18">2580×1080</text>
      <path d="M208 178h35m-7-5l7 5-7 5" stroke="#7a7b6b" fill="none" stroke-width="1.5"/>
      <text x="278" y="184" class="mono" font-size="18">3440×1440</text>
      <text x="24" y="205" class="small muted">Render resolution</text>
      <text x="278" y="205" class="small muted">Display resolution</text>
      <line x1="24" x2="528" y1="226" y2="226" class="line"/>
      <text x="24" y="256" class="label muted">PRESET FOR NEXT LAUNCH</text>
      <rect x="24" y="273" width="504" height="44" rx="2" fill="#f5f0e5" stroke="#a8a28f"/>
      <path d="M498 291l6 6 6-6" stroke="#5c6051" fill="none" stroke-width="1.5"/>
      <text x="24" y="494" class="small muted mono">Insert: toggle   ·   Esc: close   ·   Cap unchanged</text>
    </g>
  </defs>

  <rect width="1280" height="880" fill="#1d2422"/>
  <rect width="1280" height="880" fill="url(#grid)"/>
  <text x="56" y="56" class="outer" font-size="29" font-weight="500" letter-spacing="3">NIER / RENDER</text>
  <text x="56" y="85" fill="#adb5a7" style="fill:#adb5a7" font-size="14">Shared Windows / Linux design · current Proton example · two presets, no live switching</text>
  <text x="56" y="128" class="outer label">01 / CUSTOM75 ACTIVE · NO EDITS</text>
  <text x="672" y="128" class="outer label">02 / NATIVE SELECTED · NOT SAVED YET</text>

  <g id="active-state" transform="translate(56 148)">
    <use xlink:href="#panel-shell"/>
    <rect x="438" y="127" width="90" height="25" rx="2" fill="#4d5743"/>
    <circle cx="452" cy="140" r="3" fill="#e5ead9"/>
    <text x="466" y="144" class="label" style="fill:#f1f0e5;font-size:10px;letter-spacing:0.7px">ACTIVE</text>
    <text x="40" y="301" font-size="16">Custom75 — 75% per axis</text>
    <text x="24" y="341" class="small muted">Custom ratio, not the standard FSR Quality preset.</text>
    <rect x="24" y="361" width="504" height="40" rx="2" fill="#dfdfd0"/>
    <text x="40" y="386" class="body">No unsaved changes.</text>
    <rect x="24" y="421" width="320" height="44" rx="2" fill="#d6d1c2"/>
    <text x="184" y="448" text-anchor="middle" class="body disabled">Save for next launch</text>
    <rect x="356" y="421" width="172" height="44" rx="2" fill="none" stroke="#c7c1b1"/>
    <text x="442" y="448" text-anchor="middle" class="body disabled">Discard changes</text>
  </g>

  <g id="pending-state" transform="translate(672 148)">
    <use xlink:href="#panel-shell"/>
    <rect x="438" y="127" width="90" height="25" rx="2" fill="#4d5743"/>
    <circle cx="452" cy="140" r="3" fill="#e5ead9"/>
    <text x="466" y="144" class="label" style="fill:#f1f0e5;font-size:10px;letter-spacing:0.7px">ACTIVE</text>
    <rect x="393" y="240" width="135" height="22" rx="2" fill="#ded0ad"/>
    <text x="460" y="255" text-anchor="middle" class="label" style="font-size:10px;letter-spacing:0.7px">UNSAVED EDIT</text>
    <text x="40" y="301" font-size="16">Native — full-resolution AA</text>
    <text x="24" y="341" class="small muted">Keeps the AA mod; skips our upscale patches after restart.</text>
    <rect x="24" y="361" width="504" height="40" rx="2" fill="#e0d2b1"/>
    <path d="M43 372l8 15H35z" fill="none" stroke="#685735" stroke-width="1.2"/>
    <text x="60" y="386" class="body">Unsaved. This session stays on Custom75.</text>
    <rect x="24" y="421" width="320" height="44" rx="2" fill="#434b3b"/>
    <text x="184" y="448" text-anchor="middle" class="body" style="fill:#f7f3e9">Save for next launch</text>
    <rect x="356" y="421" width="172" height="44" rx="2" fill="#f2ecdf" stroke="#aaa58f"/>
    <text x="442" y="448" text-anchor="middle" class="body">Discard changes</text>
  </g>

  <g id="saved-state" transform="translate(56 712)">
    <rect width="552" height="84" rx="2" fill="#2c372d" stroke="#56614e"/>
    <text x="18" y="25" class="label" style="fill:#d6dfc9">AFTER SAVE / RESTART REQUIRED</text>
    <text x="18" y="48" class="body" style="fill:#e7eadf">Native saved for next launch.</text>
    <text x="18" y="68" class="small" style="fill:#b9c6b0">Active Custom75 and its 2580×1080 rendering stay unchanged.</text>
  </g>
  <g id="failure-state" transform="translate(672 712)">
    <rect width="552" height="84" rx="2" fill="#382c27" stroke="#806b58"/>
    <text x="18" y="25" class="label" style="fill:#e2cbb2">ON FAILURE / NO FALSE SUCCESS</text>
    <text x="18" y="48" class="body" style="fill:#f0dfcd">Explain the failure and preserve the previous known state.</text>
    <text x="18" y="68" class="small" style="fill:#d3bda6">Startup: “Not applied — renderer unchanged.” Unknown sizes: —.</text>
  </g>
  <text x="56" y="849" class="small mono" style="fill:#a8b1a1">Original design reference · not a game screenshot · no installed menu, hooks or config writes</text>
</svg>
